<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Sign in - eventhorizen</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#ecebff;background:#05040d}#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}.card{position:relative;z-index:1;width:100%;max-width:440px;padding:34px 28px;border-radius:24px;text-align:center;background:rgba(10,8,28,.72);border:1px solid rgba(255,255,255,.12);box-shadow:0 0 60px rgba(139,92,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.logo{display:flex;align-items:center;justify-content:center;gap:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px;margin-bottom:18px}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#000 0 38%,transparent 39%),conic-gradient(#ff7a3d,#ffd29a,#8b5cff,#ff7a3d);box-shadow:0 0 18px rgba(255,122,61,.55),0 0 34px rgba(139,92,255,.4);animation:s 7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#a9a7d4;line-height:1.55}a{color:#c9b8ff}input{width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#ecebff;padding:0 16px;font-size:15px;outline:none;margin:6px 0}input:focus{border-color:#8b5cff;box-shadow:0 0 0 4px rgba(139,92,255,.18)}button{width:100%;height:48px;border:0;border-radius:999px;margin-top:8px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#8b5cff,#c04bff);box-shadow:0 8px 30px rgba(139,92,255,.45)}.err{color:#ff8aa8;min-height:20px;margin:8px 0 0}</style>
<canvas id=bg></canvas><main class=card><div class=logo><i class=orb></i><span>eventhorizen</span></div>
<p>Members only.</p><form method=post action=/login><input type=password name=pw placeholder=Password autocomplete=current-password autofocus required><button type=submit>Enter</button><p class=err>{{MSG}}</p></form></main>
<script src="/wallpaper.js"></script>
